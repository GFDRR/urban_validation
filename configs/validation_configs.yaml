root_dir: /content/drive/MyDrive/Gates Foundation/Building Dataset Validation
data_dir: data/01_raw
aoi_tracker: data/02_interim/aoi_tracker.csv

# Used by figure generation in src/plots/figures.py.
size_bins:
  bins: [0, 25, 50, 100, 500, 1000, .inf]
  labels: ["<25", "25-50", "50-100", "100-500", "500-1000", ">1000"]

vector:
  preprocessing:
    min_area_m2: 20
    tile_size_m: 1000
    iou_threshold: 0.5       # IoU ≥ this to count as a match; default 0.5 per PASCAL-VOC
    tau_buffer_m: 2.0        # metres added to each geometry before IoU; 0 = no buffer
    tau_boundary: 2.0
    fix_invalid_geoms: true

  reporting:
    derive_counts: true

  datasets:
    - name: overture
      label: Overture Maps
      enabled: true

    - name: gba
      label: Global Building Atlas
      enabled: true

    - name: globfp
      label: 3D GloBFP
      enabled: true

raster:
  preprocessing:
    min_building_m2: 20.0
    oversample_factor: 4
    all_touched: false

    evaluation_grids:
      - name: 10m
        resolution: 10
      - name: 100m
        resolution: 100

    native_resolution_guard:
      enabled: true
      mode: skip_finer
      tolerance_factor: 0.95

  reporting:
    derive_counts: true

  datasets:
    - name: obt
      native_resolution_m: 4.0
      min_building_m2: 4.0
      label: Google OBT
      
      enabled: true
      year: 2023
      binarize:
        method: fraction
        band: 1  # building_presence (0–1 probability)
        clamp_min: 0.0
        clamp_max: 1.0
        # threshold_frac: 0.5
        nodata: 0

    - name: tempo
      native_resolution_m: 100
      min_building_m2: 20.0
      label: Microsoft TEMPO
      enabled: true
      year: 2023q4
      binarize:
        method: fraction
        band: 1
        clamp_min: 0.0
        clamp_max: 1.0
        # threshold_frac: 0.5
        nodata: null
      rasterization:
        oversample_factor: 16

    - name: ghsl_built_s
      native_resolution_m: 100
      min_building_m2: 20.0
      label: GHS Built-S
      enabled: true
      year: 2025
      binarize:
        method: area_m2
        band: 1
        clamp_to_pixel_area: true
        nodata: null
      rasterization:
        oversample_factor: 16

    - name: wsf_tracker
      native_resolution_m: 10
      min_building_m2: 20.0
      label: WSF Tracker
      enabled: true
      binarize:
        method: wsf_tracker
        band: 1
        built_value_min: 1
        # WSF Tracker year-code encoding: 0 = non-built; positive values = year of first
        # settlement detection. Two encodings exist depending on the product version:
        #   Sequential (1-indexed from 2015):  1=2015, 2=2016, …, 9=2023, 10=2024
        #   Two-digit year:                   15=2015, 16=2016, …, 23=2023, 24=2024
        # Verify the actual encoding before use:
        #   import rasterio, numpy as np
        #   with rasterio.open(wsf_path) as src: print(np.unique(src.read(1)))
        # Set as_of_code to match the reference dataset collection year.
        #   Sequential encoding:  as_of_code=9  → 2023;  as_of_code=10 → 2024
        #   Two-digit encoding:   as_of_code=23 → 2023;  as_of_code=24 → 2024
        # Current value 19: selects all years if sequential (max code ≤ 9); selects
        # only up to 2019 if two-digit encoding (missing 2020–2024 vs reference).
        as_of_code: 19
        nonbuilt_value: 0
        nodata: null
      rasterization:
        oversample_factor: 16

output:
  overwrite: false
  metrics:
    save_tile_level: true
  figures:
    dpi: 200
    fmt: png
